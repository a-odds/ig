    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
        }
        .header {
            text-align: center;
            padding: 15px 10px;
            background: #fff;
            border-bottom: 1px solid #dbdbdb;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .search-box {
            width: 100%;
            max-width: 400px; 
            padding: 10px 15px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            background: #efefef;
            outline: none;
            font-size: 16px;
        }
        .search-box:focus {
            border-color: #a8a8a8;
        }
        .gallery-container {
            max-width: 935px;
            margin: 20px auto;
            padding: 0 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }
        .grid-item {
            position: relative;
            aspect-ratio: 10 / 16;
            overflow: hidden;
            background: #efefef;
        }
        .id-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none; /* ทำให้คลิกทะลุไปที่รูปได้ */
        }
        .grid-item a {
            display: block;
            width: 100%;
            height: 100%;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .grid-item:hover img {
            transform: scale(1.05);
        }
        /* ปรับสำหรับหน้าจอมือถือ (Responsive 1 คอลัมน์) */
        @media (max-width: 768px) {
            .grid { 
                grid-template-columns: 1fr; 
                gap: 15px; 
            }
            .gallery-container { 
                margin: 15px auto; 
                padding: 0 15px; 
            }
            .grid-item {
                border-radius: 8px; 
            }
        }
    </style>
</head>

    <script>
        function filterImages() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            const items = document.querySelectorAll('.grid-item');
            
            // เช็คว่าช่องค้นหากรอกแต่ตัวเลขใช่หรือไม่
            const isNumberOnly = /^\d+$/.test(input);
            
            items.forEach(item => {
                const title = item.getAttribute('data-title');
                const id = item.getAttribute('data-id');
                
                if (input === '') {
                    item.style.display = '';
                } else if (isNumberOnly) {
                    // หากกรอกตัวเลข จะค้นหาจาก ID ที่เริ่มต้นด้วยเลขนั้น (เพื่อให้พิมพ์ 12 แล้วขึ้นเลยโดยไม่ต้องรอพิมพ์เสร็จ)
                    // หากต้องการให้ตรงเป๊ะ เปลี่ยนเป็น: if (id === input)
                    if (id.startsWith(input)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                } else {
                    // หากกรอกตัวอักษร จะค้นหาจาก Hover Title
                    if (title.includes(input)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                }
            });
        }
    </script>

</body>
</html>
