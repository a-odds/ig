    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; margin: 0; padding: 0; }
        .header { text-align: center; padding: 20px; background: #fff; border-bottom: 1px solid #dbdbdb; position: sticky; top: 0; z-index: 100; }
        h1 { margin: 0; font-size: 24px; color: #262626; }
        .gallery-container { max-width: 935px; margin: 20px auto; padding: 0 5px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
        .grid-item { aspect-ratio: 1/1; overflow: hidden; background: #efefef; cursor: pointer; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .grid-item:hover img { transform: scale(1.05); }

        /* Lightbox Style */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        .lightbox img { 
            max-width: 90%; max-height: 90%; 
            object-fit: contain; 
            user-select: none; 
            -webkit-user-drag: none;
        }
        
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; font-size: 35px; padding: 10px 20px; cursor: pointer; z-index: 1010; border-radius: 8px; user-select: none; }
        .nav-btn:hover { background: rgba(0,0,0,0.8); }
        .nav-left { left: 20px; }
        .nav-right { right: 20px; }

        .top-bar { position: absolute; top: 20px; right: 20px; z-index: 1010; display: flex; gap: 10px; }
        .top-bar button { background: rgba(0,0,0,0.5); color: white; border: none; font-size: 24px; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; }
        .top-bar button:hover { background: rgba(0,0,0,0.8); }

        /* ชุดปุ่มควบคุมมุมซ้ายบน */
        .top-left-controls { position: absolute; top: 20px; left: 20px; z-index: 1010; display: flex; flex-direction: column; gap: 10px; }
        
        .control-bar { display: flex; gap: 15px; background: rgba(0,0,0,0.6); padding: 10px 25px; border-radius: 30px; align-items: center; justify-content: center; }
        .control-bar button { background: none; border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .control-bar button:hover { color: #0095f6; transform: scale(1.1); }
        .play-btn { font-size: 32px !important; }

        .info-bar { display: flex; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; align-items: center; color: white; gap: 8px; font-size: 16px; justify-content: center; font-family: monospace; }
        .info-bar input { width: 50px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; text-align: center; font-size: 16px; border-radius: 6px; padding: 4px; outline: none; transition: background 0.2s; font-family: monospace; }
        .info-bar input:focus { background: rgba(255,255,255,0.4); border-color: #0095f6; }
        
        /* ซ่อนลูกศรใน input type number */
        .info-bar input::-webkit-outer-spin-button, .info-bar input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .info-bar input[type=number] { -moz-appearance: textfield; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
            .top-left-controls { top: 15px; left: 15px; gap: 8px; }
            .control-bar { padding: 5px 15px; gap: 10px; }
            .control-bar button { font-size: 20px; }
            .play-btn { font-size: 24px !important; }
            .info-bar { font-size: 14px; padding: 5px 10px; }
            .info-bar input { width: 40px; font-size: 14px; padding: 2px; }
        }
    </style>

ial-3969201957308410979_4-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/05-khaimook.bnk48official-3969201961410293873_5-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/06-khaimook.bnk48official-3969201966661674132_6-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/07-khaimook.bnk48official-3969201971862506883_7-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/08-khaimook.bnk48official-3969201979697610013_8-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/09-khaimook.bnk48official-3969201984227430917_9-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/11-khaimook.bnk48official-3969201987322830494_11-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/12-khaimook.bnk48official-3969201992960024973_12-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/13-khaimook.bnk48official-3969201995400882840_13-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/14-khaimook.bnk48official-3969202000551555220_14-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/15-khaimook.bnk48official-3969202014728301431_15-20260822_150330.jpg", "Khaimook/khaimook.bnk48official-DcVcH0FGE_e-20260822_150331/16-khaimook.bnk48official-3969202023880436626_16-20260822_150330.jpg", "Khaimook/khaimook.bnk48official_DULG2ofEWEE_20260131_183407/01-khaimook.bnk48official-20260131_183405-3571191561.jpg", "Khaimook/khaimook.bnk48official_DULG2ofEWEE_20260131_183407/02-khaimook.bnk48official-20260131_183405-3467296688.jpg", "Khaimook/khaimook.bnk48official_DULG2ofEWEE_20260131_183407/03-khaimook.bnk48official-20260131_183405-1443772690.jpg", "Khaimook/khaimook.bnk48official_DULG2ofEWEE_20260131_183407/04-khaimook.bnk48official-20260131_183405-1788861994.jpg", "Khaimook/khaimook.bnk48official_DULG2ofEWEE_20260131_183407/05-khaimook.bnk48official-20260131_183405-3211602952.jpg", "Khaimook/khaimook.bnk48official_DUZ5Bp6EWgV_20260206_122153/01-khaimook.bnk48official-20260206_122152-2894850646.jpg", "Khaimook/khaimook.bnk48official_DUZ5Bp6EWgV_20260206_122153/02-khaimook.bnk48official-20260206_122152-3145724568.jpg", "Khaimook/khaimook.bnk48official_DUZ5Bp6EWgV_20260206_122153/03-khaimook.bnk48official-20260206_122152-4006902793.jpg", "Khaimook/khaimook.bnk48official_DUZ5Bp6EWgV_20260206_122153/04-khaimook.bnk48official-20260206_122152-1377364314.jpg", "Khaimook/khaimook.bnk48official_DUZ5Bp6EWgV_20260206_122153/05-khaimook.bnk48official-20260206_122152-3498607160.jpg", "Khaimook/khaimook.bnk48official_DUZ5Bp6EWgV_20260206_122153/06-khaimook.bnk48official-20260206_122152-2253336800.jpg", "Khaimook/khaimook.bnk48official_DUZ5Bp6EWgV_20260206_122153/07-khaimook.bnk48official-20260206_122152-1670789850.jpg", "Khaimook/khaimook.bnk48official_DWLHpuzkXfH_20260322_114353/01-khaimook.bnk48official-20260322_114351-3074892111.jpg", "Khaimook/khaimook.bnk48official_DWLHpuzkXfH_20260322_114353/02-khaimook.bnk48official-20260322_114351-529458177.jpg", "Khaimook/khaimook.bnk48official_DWLHpuzkXfH_20260322_114353/03-khaimook.bnk48official-20260322_114351-1459029798.jpg", "Khaimook/khaimook.bnk48official_DWLHpuzkXfH_20260322_114353/04-khaimook.bnk48official-20260322_114351-4279714004.jpg", "Khaimook/khaimook.bnk48official_DWLHpuzkXfH_20260322_114353/05-khaimook.bnk48official-20260322_114351-4048023701.jpg", "Khaimook/khaimook.bnk48official_DWLHpuzkXfH_20260322_114353/06-khaimook.bnk48official-20260322_114351-2981415531.jpg", "Khaimook/khaimook.bnk48official_DWLHpuzkXfH_20260322_114353/07-khaimook.bnk48official-20260322_114351-3259562503.jpg"];
        let currentIndex = 0;
        let currentScale = 1;
        let translateX = 0;
        let translateY = 0;
        let playing = false;
        let playInterval;

        let isDragging = false;
        let startX = 0, startY = 0;
        let swipeStartX = 0;

        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        const playBtn = document.getElementById('play-btn');
        const imgInput = document.getElementById('img-input');
        const totalImgSpan = document.getElementById('total-img');

        function openLightbox(index) {
            currentIndex = index;
            totalImgSpan.textContent = images.length;
            imgInput.max = images.length;
            
            resetTransform();
            updateImg(false);
            lb.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeLightbox() {
            lb.style.display = 'none';
            document.body.style.overflow = 'auto';
            if(playing) togglePlay();
            if(document.fullscreenElement) document.exitFullscreen();
        }

        function resetTransform() {
            currentScale = 1;
            translateX = 0;
            translateY = 0;
        }

        function updateImg(smooth = true) {
            lbImg.style.transition = smooth ? 'transform 0.2s ease-out' : 'none';
            lbImg.src = images[currentIndex];
            lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
            
            // อัปเดตตัวเลขในช่อง Input
            imgInput.value = currentIndex + 1;
            
            if (currentScale > 1) {
                lbImg.style.cursor = isDragging ? 'grabbing' : 'grab';
            } else {
                lbImg.style.cursor = 'default';
            }
        }

        function jumpToImg() {
            let val = parseInt(imgInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > images.length) val = images.length;
            
            currentIndex = val - 1;
            imgInput.value = val;
            resetTransform();
            updateImg(true);
        }

        function nextImg() {
            currentIndex = (currentIndex + 1) % images.length;
            resetTransform();
            updateImg(true);
        }

        function prevImg() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            resetTransform();
            updateImg(true);
        }

        function zoomIn() {
            currentScale += 0.25;
            updateImg(true);
        }

        function zoomOut() {
            currentScale = Math.max(0.25, currentScale - 0.25);
            if (currentScale <= 1) resetTransform();
            updateImg(true);
        }

        function togglePlay() {
            playing = !playing;
            playBtn.innerHTML = playing ? '⏸' : '▶';
            if(playing) {
                playInterval = setInterval(nextImg, 2500);
            } else {
                clearInterval(playInterval);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                lb.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        function isInteractiveElement(target) {
            const tag = target.tagName.toLowerCase();
            return tag === 'button' || tag === 'input' || target.closest('button');
        }

        /* Drag, Pan & Swipe Events */
        lb.addEventListener('mousedown', (e) => {
            if (isInteractiveElement(e.target)) return;

            if (currentScale > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                updateImg(false);
                e.preventDefault();
            } else {
                isDragging = true;
                swipeStartX = e.clientX;
                e.preventDefault();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging && currentScale > 1) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateImg(false);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                if (currentScale > 1) {
                    updateImg(false);
                } else {
                    let diffX = e.clientX - swipeStartX;
                    if (diffX > 50) prevImg();       
                    else if (diffX < -50) nextImg(); 
                }
            }
        });

        lb.addEventListener('touchstart', (e) => {
            if (isInteractiveElement(e.target)) return;

            if (currentScale > 1 && e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            } else if (currentScale === 1 && e.touches.length === 1) {
                isDragging = true;
                swipeStartX = e.touches[0].clientX;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && currentScale > 1 && e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                updateImg(false);
            }
        });

        window.addEventListener('touchend', (e) => {
            if (isDragging) {
                isDragging = false;
                if (currentScale > 1) {
                    updateImg(false);
                } else {
                    let diffX = e.changedTouches[0].clientX - swipeStartX;
                    if (diffX > 50) prevImg();       
                    else if (diffX < -50) nextImg(); 
                }
            }
        });

        /* คีย์บอร์ด Shortcut */
        window.addEventListener('keydown', function(e) {
            if (lb.style.display === 'flex') {
                if (document.activeElement === imgInput) {
                    if (e.key === 'Enter') {
                        imgInput.blur(); 
                    } else if (e.key === 'Escape') {
                        imgInput.blur();
                    }
                    return; 
                }

                if (e.key === 'ArrowRight') {
                    nextImg();
                } else if (e.key === 'ArrowLeft') {
                    prevImg();
                } else if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === '+' || e.key === '=') {
                    zoomIn();
                } else if (e.key === '-') {
                    zoomOut();
                } else if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault(); 
                    togglePlay();
                } else if (e.key.toLowerCase() === 'f') {
                    toggleFullscreen();
                }
            }
        });

        /* ลูกกลิ้งเมาส์ & Shift+Scroll */
        lb.addEventListener('wheel', function(e) {
            if (lb.style.display === 'flex') {
                e.preventDefault(); 
                
                if (e.shiftKey) {
                    if (e.deltaY < 0) {
                        zoomIn(); 
                    } else {
                        zoomOut(); 
                    }
                } else {
                    if (e.deltaY > 0) {
                        nextImg(); 
                    } else {
                        prevImg(); 
                    }
                }
            }
        }, { passive: false });
    </script>
