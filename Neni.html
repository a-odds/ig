            translateX = 0;
            translateY = 0;
        }

        function updateImg(smooth = true) {
            lbImg.style.transition = smooth ? 'transform 0.2s ease-out' : 'none';
            lbImg.src = images[currentIndex];
            lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
            
            // อัปเดตตัวเลขในช่อง Input
            imgInput.value = currentIndex + 1;
            
            if (currentScale > 1) {
                lbImg.style.cursor = isDragging ? 'grabbing' : 'grab';
            } else {
                lbImg.style.cursor = 'default';
            }
        }

        function jumpToImg() {
            let val = parseInt(imgInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > images.length) val = images.length;
            
            currentIndex = val - 1;
            imgInput.value = val;
            resetTransform();
            updateImg(true);
        }

        function nextImg() {
            currentIndex = (currentIndex + 1) % images.length;
            resetTransform();
            updateImg(true);
        }

        function prevImg() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            resetTransform();
            updateImg(true);
        }

        function zoomIn() {
            currentScale += 0.25;
            updateImg(true);
        }

        function zoomOut() {
            currentScale = Math.max(0.25, currentScale - 0.25);
            if (currentScale <= 1) resetTransform();
            updateImg(true);
        }

        function togglePlay() {
            playing = !playing;
            playBtn.innerHTML = playing ? '⏸' : '▶';
            if(playing) {
                playInterval = setInterval(nextImg, 2500);
            } else {
                clearInterval(playInterval);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                lb.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        function isInteractiveElement(target) {
            const tag = target.tagName.toLowerCase();
            return tag === 'button' || tag === 'input' || target.closest('button');
        }

        /* Drag, Pan & Swipe Events */
        lb.addEventListener('mousedown', (e) => {
            if (isInteractiveElement(e.target)) return;

            if (currentScale > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                updateImg(false);
                e.preventDefault();
            } else {
                isDragging = true;
                swipeStartX = e.clientX;
                e.preventDefault();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging && currentScale > 1) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateImg(false);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                if (currentScale > 1) {
                    updateImg(false);
                } else {
                    let diffX = e.clientX - swipeStartX;
                    if (diffX > 50) prevImg();       
                    else if (diffX < -50) nextImg(); 
                }
            }
        });

        lb.addEventListener('touchstart', (e) => {
            if (isInteractiveElement(e.target)) return;

            if (currentScale > 1 && e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            } else if (currentScale === 1 && e.touches.length === 1) {
                isDragging = true;
                swipeStartX = e.touches[0].clientX;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && currentScale > 1 && e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                updateImg(false);
            }
        });

        window.addEventListener('touchend', (e) => {
            if (isDragging) {
                isDragging = false;
                if (currentScale > 1) {
                    updateImg(false);
                } else {
                    let diffX = e.changedTouches[0].clientX - swipeStartX;
                    if (diffX > 50) prevImg();       
                    else if (diffX < -50) nextImg(); 
                }
            }
        });

        /* คีย์บอร์ด Shortcut */
        window.addEventListener('keydown', function(e) {
            if (lb.style.display === 'flex') {
                if (document.activeElement === imgInput) {
                    if (e.key === 'Enter') {
                        imgInput.blur(); 
                    } else if (e.key === 'Escape') {
                        imgInput.blur();
                    }
                    return; 
                }

                if (e.key === 'ArrowRight') {
                    nextImg();
                } else if (e.key === 'ArrowLeft') {
                    prevImg();
                } else if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === '+' || e.key === '=') {
                    zoomIn();
                } else if (e.key === '-') {
                    zoomOut();
                } else if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault(); 
                    togglePlay();
                } else if (e.key.toLowerCase() === 'f') {
                    toggleFullscreen();
                }
            }
        });

        /* ลูกกลิ้งเมาส์ & Shift+Scroll */
        lb.addEventListener('wheel', function(e) {
            if (lb.style.display === 'flex') {
                e.preventDefault(); 
                
                if (e.shiftKey) {
                    if (e.deltaY < 0) {
                        zoomIn(); 
                    } else {
                        zoomOut(); 
                    }
                } else {
                    if (e.deltaY > 0) {
                        nextImg(); 
                    } else {
                        prevImg(); 
                    }
                }
            }
        }, { passive: false });
    </script>
</body>
</html>
